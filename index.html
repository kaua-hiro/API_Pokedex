<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Unit-01</title>
    <meta name="description" content="Pokédex Unit-01: escaneie, busque e filtre Pokémon de todas as gerações com dados em tempo real da PokeAPI, num terminal com cara de dispositivo de verdade.">
    <meta name="theme-color" content="#C6392C">
    <meta property="og:title" content="Pokédex Unit-01">
    <meta property="og:description" content="Escaneie Pokémon de todas as gerações num terminal com cara de dispositivo de verdade.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23C6392C' stroke='%230C0F10' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%230C0F10' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23F4F1E9' stroke='%230C0F10' stroke-width='6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="device">
        <header class="device__header">
            <div class="device__brand">
                <span class="device__lens" aria-hidden="true">
                    <span class="device__led"></span>
                </span>
                <span class="device__indicators" aria-hidden="true">
                    <span class="dot dot--red"></span>
                    <span class="dot dot--yellow"></span>
                    <span class="dot dot--green"></span>
                </span>
                <div class="device__brand-text">
                    <h1>Pokédex</h1>
                    <p class="device__subtitle" id="unit-subtitle">Unit-01 · Kanto</p>
                </div>
            </div>

            <button id="theme-toggle" class="device__switch" aria-label="Alternar carcaça clara/escura" type="button">
                <span class="device__switch-track">
                    <span class="device__switch-thumb"></span>
                </span>
                <span class="device__switch-label">MODO</span>
            </button>
        </header>

        <div class="device__hinge" aria-hidden="true">
            <span class="device__knuckle"></span>
            <span class="device__knuckle"></span>
        </div>

        <div class="device__screen">
            <div class="terminal-bar" role="search">
                <label for="search" class="visually-hidden">Buscar Pokémon por nome</label>
                <span class="terminal-bar__prompt" aria-hidden="true">&gt;</span>
                <input type="text" id="search" placeholder="scan por nome ou número..." autocomplete="off">
                <span class="terminal-bar__cursor" aria-hidden="true"></span>
                <button type="button" class="search-icon" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div class="console">
                <div class="dpad" aria-hidden="true">
                    <span class="dpad__arm dpad__arm--up"></span>
                    <span class="dpad__arm dpad__arm--right"></span>
                    <span class="dpad__arm dpad__arm--down"></span>
                    <span class="dpad__arm dpad__arm--left"></span>
                    <span class="dpad__center"></span>
                </div>
                <div class="console__buttons">
                    <button type="button" id="btn-search" class="hw-button hw-button--green" aria-label="Buscar">
                        <span class="hw-button__label">A</span>
                    </button>
                    <button type="button" id="btn-clear" class="hw-button hw-button--red" aria-label="Limpar busca e filtros">
                        <span class="hw-button__label">B</span>
                    </button>
                </div>
            </div>

            <div class="control-strip">
                <div class="control">
                    <label for="generation-filter">GEN</label>
                    <select id="generation-filter" class="modern-select" aria-label="Filtrar por geração">
                        <option value="all">Todas</option>
                        <option value="1">Kanto</option>
                        <option value="2">Johto</option>
                        <option value="3">Hoenn</option>
                        <option value="4">Sinnoh</option>
                        <option value="5">Unova</option>
                        <option value="6">Kalos</option>
                        <option value="7">Alola</option>
                        <option value="8">Galar</option>
                        <option value="9">Paldea</option>
                    </select>
                </div>

                <div class="control">
                    <label for="type-filter">TIPO</label>
                    <select id="type-filter" class="modern-select" aria-label="Filtrar por tipo">
                        <option value="">Todos</option>
                        <option value="grass">Grama</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="bug">Inseto</option>
                        <option value="normal">Normal</option>
                        <option value="poison">Venenoso</option>
                        <option value="electric">Elétrico</option>
                        <option value="ground">Terra</option>
                        <option value="fairy">Fada</option>
                        <option value="fighting">Lutador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="rock">Pedra</option>
                        <option value="ghost">Fantasma</option>
                        <option value="ice">Gelo</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="flying">Voador</option>
                    </select>
                </div>

                <div class="control-strip__status" aria-hidden="true">
                    <span class="status-dot"></span> ONLINE
                </div>
            </div>

            <main>
                <div class="pokedex-container" id="pokedex" aria-live="polite" aria-busy="false"></div>
                <div id="scroll-trigger" style="height: 50px;"></div>
                <div id="modal-container"></div>
            </main>
        </div>

        <footer class="device__footer">
            <div class="device__vents" aria-hidden="true"></div>
            <p>© <span id="current-year"></span> Pokédex Unit-01 · Dados via PokeAPI</p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
