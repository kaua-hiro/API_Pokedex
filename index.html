<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - 1ª Geração e além</title>
    <meta name="description" content="Pokédex interativa com tema espacial: navegue, busque e filtre Pokémon de todas as gerações com dados em tempo real da PokeAPI.">
    <meta name="theme-color" content="#090A0F">
    <meta property="og:title" content="Pokédex">
    <meta property="og:description" content="Explore os Pokémon de todas as gerações com busca, filtros e detalhes completos de estatísticas.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23222' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%23222' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%23222' stroke-width='6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-container dark-bg"></div> 
    <div class="walppaper"></div>
    <div class="galaxy"></div>
    <div class="stars-layer"></div>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <header>
        <h1>Pokedex</h1>
        <div class="search-container" role="search">
            <label for="search" class="visually-hidden">Buscar Pokémon por nome</label>
            <input type="text" id="search" placeholder="Buscar Pokémon..." autocomplete="off">
            <i class="search-icon" role="button" tabindex="0" aria-label="Buscar">🔍</i>
        </div>
        <button id="theme-toggle" class="theme-toggle-button" aria-label="Alternar tema claro/escuro">🌙</button>
    </header>

    <div class="filters-section">
        <div class="filter-group">
            <div class="filter-card">
                <label for="type-filter" class="filter-label">
                    <i class="filter-icon">🌿</i>
                    <span>Tipo</span>
                </label>
                <select id="type-filter" class="modern-select" aria-label="Filtrar por tipo">
                    <option value="">Todos os Tipos</option> 
                    <option value="grass">Grama</option>
                    <option value="fire">Fogo</option>
                    <option value="water">Água</option>
                    <option value="bug">Inseto</option>
                    <option value="normal">Normal</option>
                    <option value="poison">Venenoso</option>
                    <option value="electric">Elétrico</option>
                    <option value="ground">Terra</option>
                    <option value="fairy">Fada</option>
                    <option value="fighting">Lutador</option>
                    <option value="psychic">Psíquico</option>
                    <option value="rock">Pedra</option>
                    <option value="ghost">Fantasma</option>
                    <option value="ice">Gelo</option>
                    <option value="dragon">Dragão</option>
                    <option value="dark">Sombrio</option>
                    <option value="steel">Aço</option>
                    <option value="flying">Voador</option>
                </select>
            </div>

            <div class="filter-card">
                <label for="generation-filter" class="filter-label">
                    <i class="filter-icon">🌟</i>
                    <span>Geração</span>
                </label>
                <select id="generation-filter" class="modern-select" aria-label="Filtrar por geração">
                    <option value="all">Todas as Gerações</option>
                    <option value="1">1ª Geração (Kanto)</option>
                    <option value="2">2ª Geração (Johto)</option>
                    <option value="3">3ª Geração (Hoenn)</option>
                    <option value="4">4ª Geração (Sinnoh)</option>
                    <option value="5">5ª Geração (Unova)</option>
                    <option value="6">6ª Geração (Kalos)</option>
                    <option value="7">7ª Geração (Alola)</option>
                    <option value="8">8ª Geração (Galar)</option>
                    <option value="9">9ª Geração (Paldea)</option>
                </select>
            </div>
        </div>
    </div>

    <main>
        <div class="pokedex-container" id="pokedex" aria-live="polite" aria-busy="false"></div>
        <div id="scroll-trigger" style="height: 50px;"></div>
        <div id="modal-container"></div>
    </main>

    <footer>
        <p>© <span id="current-year"></span> Pokédex - Todos os direitos reservados</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
