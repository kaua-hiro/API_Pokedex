<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinal Perdido | Pokédex Unit-01</title>
    <meta name="theme-color" content="#C6392C">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1.1rem;
            padding: clamp(2.5rem, 8vw, 5rem) 1.5rem;
        }
        .not-found__code {
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 12vw, 6rem);
            font-weight: 700;
            color: var(--danger);
            letter-spacing: 0.05em;
        }
        .not-found__image {
            width: 130px;
            height: 130px;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25)) grayscale(0.6);
            opacity: 0.85;
        }
        .not-found__message {
            font-family: var(--font-mono);
            font-size: 1rem;
            letter-spacing: 0.04em;
            color: var(--text-primary);
            max-width: 420px;
        }
        .not-found__hint {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 420px;
        }
        .home-button {
            margin-top: 0.5rem;
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: 0.06em;
            font-size: 0.85rem;
            padding: 10px 26px;
            border: 1px solid var(--phosphor);
            border-radius: 8px;
            background: transparent;
            color: var(--phosphor);
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .home-button:hover,
        .home-button:focus-visible {
            background: var(--phosphor);
            color: var(--screen-bg-raised);
            outline: none;
        }
    </style>
</head>
<body>
    <div class="device">
        <header class="device__header">
            <div class="device__brand">
                <span class="device__led" aria-hidden="true" style="background: radial-gradient(circle at 35% 30%, #ffd9b0, var(--danger) 60%); box-shadow: 0 0 0 3px rgba(0,0,0,0.15) inset, 0 0 12px 2px var(--danger);"></span>
                <div class="device__brand-text">
                    <h1>Pokédex</h1>
                    <p class="device__subtitle">Unit-01 · Erro 404</p>
                </div>
            </div>
        </header>

        <div class="device__screen">
            <div class="not-found">
                <div class="not-found__code">404</div>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
                     alt="Pikachu, ícone do erro"
                     class="not-found__image">
                <p class="not-found__message">SINAL PERDIDO — o espécime que você procura não está nesta frequência.</p>
                <p class="not-found__hint">A página não existe ou foi movida. Volte ao terminal principal e escaneie de novo.</p>
                <a href="./" class="home-button">VOLTAR AO TERMINAL</a>
            </div>
        </div>

        <footer class="device__footer">
            <div class="device__vents" aria-hidden="true"></div>
            <p>© <span id="current-year">2026</span> Pokédex Unit-01</p>
        </footer>
    </div>
</body>
</html>
